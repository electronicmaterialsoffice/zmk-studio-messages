syntax = "proto3";

package zmk.backlight;

message Request {
    oneof request_type {
        bool backlight_on = 1;
        bool backlight_off = 2;
        bool backlight_toggle = 3;
        bool backlight_is_on = 4;
        bool backlight_get_brightness = 5;
        uint32 backlight_set_brightness = 6;
    }
}

message Response {
    oneof response_type {
        bool backlight_on = 1;
        bool backlight_off = 2;
        bool backlight_toggle = 3;
        bool backlight_is_on = 4;
        uint32 backlight_get_brightness = 5;
        bool backlight_set_brightness = 6;
    }
}

message State {
    bool on = 1;
    uint32 brightness = 2;
}

// Pushed when backlight state changes on the device side (the &bl keymap
// behavior or an RPC set), so a connected client stays in sync.
message Notification {
    oneof notification_type {
        State state_changed = 1;
    }
}