// Requests
syntax = "proto3";

package zmk.studio;

import "meta.proto";
import "core.proto";
import "behaviors.proto";
import "keymap.proto";
import "backlight.proto";
import "altar_ii.proto";
import "haptics.proto";
import "magdial.proto";
import "audio.proto";

message Request {
    uint32 request_id = 1;

    oneof subsystem {
        zmk.core.Request core = 3;
        zmk.behaviors.Request behaviors = 4;
        zmk.keymap.Request keymap = 5;
        zmk.backlight.Request backlight = 8;
        zmk.altar_ii.Request altar_ii = 32;
        zmk.haptics.Request haptics = 33;
        zmk.magdial.Request magdial = 34;
        zmk.audio.Request audio = 35;
    }
}

message Response {
    oneof type {
        RequestResponse request_response = 1;
        Notification notification = 2;
    }
}

message RequestResponse {
    uint32 request_id = 1;
    oneof subsystem {
        zmk.meta.Response meta = 2;
        zmk.core.Response core = 3;
        zmk.behaviors.Response behaviors = 4;
        zmk.keymap.Response keymap = 5;
        zmk.backlight.Response backlight = 8;
        zmk.altar_ii.Response altar_ii = 32;
        zmk.haptics.Response haptics = 33;
        zmk.magdial.Response magdial = 34;
        zmk.audio.Response audio = 35;
    }
}

message Notification {
    oneof subsystem {
        zmk.core.Notification core = 2;
        zmk.keymap.Notification keymap = 5;
        zmk.backlight.Notification backlight = 8;
        zmk.audio.Notification audio = 35;
    }
}
